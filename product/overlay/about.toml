# THIRD_PARTY_LICENSES of a release (cargo-about; .github/workflows/release.yml
# `licenses` job): every crate compiled into the `rootmark` binary, with the
# licence text it ships. A crate under a licence not listed here fails the
# release (never a silent omission).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true

# the workspace's own crates (no license field of their own; the repository is
# Apache-2.0: LICENSE at the root)
[rootmark-core.clarify]
license = "Apache-2.0"
[[rootmark-core.clarify.files]]
path = "../LICENSE"
license = "Apache-2.0"
checksum = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"

[rootmark-index.clarify]
license = "Apache-2.0"
[[rootmark-index.clarify.files]]
path = "../LICENSE"
license = "Apache-2.0"
checksum = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
