# The RootMark release (RELEASING.md). Started by a human only
# (workflow_dispatch) with the release tag vX.Y.Z, which a human has set on
# a transfer commit of main beforehand. Every asset is built here, from that
# tag, and listed in ONE SHA256SUMS:
#   rootmark-X.Y.Z-<target>.tar.gz (aarch64-apple-darwin, x86_64-unknown-linux-gnu;
#     x86_64-pc-windows-msvc .zip as information, kept when it builds)
#   install.sh, install.ps1
#   rootmark_bindings-X.Y.Z-*.whl (the Python module, not on PyPI)
#   rootmark-obsidian-X.Y.Z.zip and main.js, manifest.json, styles.css (BRAT)
#   THIRD_PARTY_LICENSES (cargo-about; also inside every archive and the image)
# Each archive is installed with its installer and checked (`--version`,
# `rootmark conformance` 39/39); every asset gets a build provenance
# attestation (`gh attestation verify <file> -R rootmark-ai/rootmark`); the
# GitHub release is created with the assets and the CHANGELOG section; then
# the container image (image.yml: ghcr.io and Docker Hub, one digest) and the
# Homebrew formula (a pull request to rootmark-ai/homebrew-tap).
name: release
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag (vX.Y.Z), already set by a human on main"
        required: true
        type: string

jobs:
  check:
    name: the tag and the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: v
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z: $TAG" >&2; exit 1; }
          git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null
          git merge-base --is-ancestor "$TAG" origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' server/Cargo.toml | head -1)"
          [ "v$ver" = "$TAG" ] || { echo "server/Cargo.toml says $ver, the tag is $TAG" >&2; exit 1; }
          grep -q "^## $ver" CHANGELOG.md || { echo "CHANGELOG.md has no ## $ver section" >&2; exit 1; }
          echo "version=$ver" >>"$GITHUB_OUTPUT"

  licenses:
    name: THIRD_PARTY_LICENSES
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: cargo-about 0.9.3 (published 2026-10-26; pinned, --locked)
        run: cargo install --locked --quiet --features cli cargo-about@0.9.3
      - run: cargo about generate --locked --fail -c about.toml -m server/Cargo.toml about.hbs >THIRD_PARTY_LICENSES
      - run: test -s THIRD_PARTY_LICENSES && grep -q '^Used by:' THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES

  binary:
    name: rootmark ${{ matrix.target }}
    needs: [check, licenses]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, archive: tar.gz, required: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, archive: tar.gz, required: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip, required: false }
    defaults:
      run:
        shell: bash
    env:
      VER: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: third-party-licenses
      - uses: actions/cache@v6.1.0
        with:
          path: models/minilm-l6-v2
          key: models-${{ hashFiles('models/MANIFEST.json') }}
      - name: embedder model (pinned, checked)
        run: bash scripts/fetch_model.sh
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p rootmark-server --bin rootmark
      - name: check (version, spec version, rootmark conformance 39/39)
        env:
          ROOTMARK_MODELS: ${{ github.workspace }}/models
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          bin=target/${{ matrix.target }}/release/rootmark
          [ -f "$bin" ] || bin="$bin.exe"
          bash scripts/release_target.sh check ${{ matrix.target }} ${{ matrix.required }} dist/bin/${{ matrix.target }}.json "$bin"
          jq -e .ok dist/bin/${{ matrix.target }}.json
      - name: package
        run: |
          set -euo pipefail
          d="rootmark-$VER-${{ matrix.target }}"
          mkdir -p "$d/models"
          cp target/${{ matrix.target }}/release/rootmark* "$d/" 2>/dev/null || true
          rm -f "$d"/*.d "$d"/*.pdb
          cp LICENSE NOTICE README.md THIRD_PARTY_LICENSES "$d/"; cp models/MANIFEST.json scripts/fetch_model.sh "$d/models/"
          if [ "${{ matrix.archive }}" = zip ]; then 7z a "$d.zip" "$d" >/dev/null; else tar -czf "$d.tar.gz" "$d"; fi
      - name: install from the archive (install.sh, SHA256SUMS, model) and check the installed binary
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          a="rootmark-$VER-${{ matrix.target }}.tar.gz"
          mkdir -p inst-src && cp "$a" inst-src/
          (cd inst-src && { sha256sum "$a" 2>/dev/null || shasum -a 256 "$a"; } >SHA256SUMS)
          bash packaging/install.sh --from inst-src --prefix "$RUNNER_TEMP/rm"
          export ROOTMARK_MODELS="$RUNNER_TEMP/rm/share/rootmark/models"
          bin="$RUNNER_TEMP/rm/bin/rootmark"
          [ "$("$bin" --version)" = "rootmark $VER" ]
          "$bin" conformance >conf.json || { cat conf.json; exit 1; }
          jq -e '.level_claimed == 3 and .passed == 39 and .total == 39 and .fixtures_manifest == "ok"' conf.json
      - name: install from the archive (install.ps1) and check the installed binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $a = "rootmark-$env:VER-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force inst-src | Out-Null
          Copy-Item $a inst-src/
          "$((Get-FileHash -Algorithm SHA256 $a).Hash.ToLower())  $a" | Set-Content -Encoding ascii inst-src/SHA256SUMS
          ./packaging/install.ps1 -From inst-src -Prefix "$env:RUNNER_TEMP\rm"
          $env:ROOTMARK_MODELS = "$env:RUNNER_TEMP\rm\models"
          & "$env:RUNNER_TEMP\rm\rootmark.exe" conformance | Set-Content -Encoding utf8 conf.json
          if ($LASTEXITCODE -ne 0) { Get-Content conf.json; exit 1 }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rootmark-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            rootmark-*-${{ matrix.target }}.*
            dist/bin/${{ matrix.target }}.json

  wheel:
    name: Python wheel (rootmark_bindings)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: astral-sh/setup-uv@v10.2.0
      - name: maturin 1.15.0 (pinned)
        run: uvx --from maturin==1.15.0 maturin build --release --locked -m bindings/python/Cargo.toml -o wheel
      - run: ls wheel/rootmark_bindings-${{ needs.check.outputs.version }}-*.whl
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheel
          path: wheel/*.whl

  plugin:
    name: Obsidian plugin
    needs: check
    runs-on: ubuntu-24.04
    env:
      VER: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: cd clients/obsidian && npm ci && npm test && npm run build
      - name: zip and the BRAT files
        run: |
          set -euo pipefail
          [ "$(jq -r .version clients/obsidian/manifest.json)" = "$VER" ]
          mkdir -p plugin/rootmark-$VER
          cp clients/obsidian/main.js clients/obsidian/manifest.json clients/obsidian/styles.css plugin/rootmark-$VER/
          (cd plugin && zip -qrX "rootmark-obsidian-$VER.zip" "rootmark-$VER")
          cp plugin/rootmark-$VER/* plugin/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: plugin
          path: |
            plugin/rootmark-obsidian-*.zip
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css

  publish:
    name: SHA256SUMS, provenance, GitHub release
    needs: [check, licenses, binary, wheel, plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # the GitHub release
      id-token: write      # actions/attest-build-provenance (OIDC)
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      VER: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artefacts
      - name: every required target passed
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            jq -e .ok "artefacts/rootmark-$t/dist/bin/$t.json" >/dev/null || { echo "required target $t did not pass" >&2; exit 1; }
            test -f "artefacts/rootmark-$t/rootmark-$VER-$t.tar.gz"
          done
      - name: assemble and SHA256SUMS over every asset
        run: |
          set -euo pipefail
          mkdir -p release
          find artefacts -type f \( -name "rootmark-$VER-*.tar.gz" -o -name "rootmark-$VER-*.zip" \) -exec cp {} release/ \;
          cp packaging/install.sh packaging/install.ps1 release/
          cp artefacts/wheel/*.whl artefacts/third-party-licenses/THIRD_PARTY_LICENSES release/
          cp artefacts/plugin/rootmark-obsidian-$VER.zip artefacts/plugin/main.js artefacts/plugin/manifest.json artefacts/plugin/styles.css release/
          (cd release && sha256sum -- * >SHA256SUMS && cat SHA256SUMS && sha256sum -c SHA256SUMS)
          n="$(wc -l <release/SHA256SUMS)"; f="$(ls release | grep -vc '^SHA256SUMS$')"
          [ "$n" = "$f" ] || { echo "SHA256SUMS lists $n files, release/ has $f" >&2; exit 1; }
      - name: build provenance of every asset
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release/*
      - name: the GitHub release (notes from CHANGELOG.md)
        run: |
          set -euo pipefail
          awk -v v="$VER" '$0 ~ "^## " v {p=1; next} p && /^## / {exit} p' CHANGELOG.md >notes.md
          printf '\nVerify: `sha256sum -c SHA256SUMS` and `gh attestation verify <file> -R %s`.\nImage: `ghcr.io/rootmark-ai/rootmark:%s` (also `rootmark/rootmark:%s`).\n' "$GITHUB_REPOSITORY" "$VER" "$VER" >>notes.md
          gh release create "$TAG" release/* --verify-tag --title "RootMark $VER" --notes-file notes.md

  image:
    name: container image
    needs: [check, publish]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  tap:
    name: Homebrew formula (pull request to the tap)
    needs: [check, publish]
    runs-on: ubuntu-24.04
    env:
      VER: ${{ needs.check.outputs.version }}
      TAG: ${{ inputs.tag }}
      TAP: rootmark-ai/homebrew-tap
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: the formula from the published SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -p SHA256SUMS -D pub
          arm="$(awk -v f="rootmark-$VER-aarch64-apple-darwin.tar.gz" '$2 == f {print $1}' pub/SHA256SUMS)"
          lin="$(awk -v f="rootmark-$VER-x86_64-unknown-linux-gnu.tar.gz" '$2 == f {print $1}' pub/SHA256SUMS)"
          [[ "$arm" =~ ^[0-9a-f]{64}$ && "$lin" =~ ^[0-9a-f]{64}$ ]] || { echo "no archive hash in SHA256SUMS" >&2; exit 1; }
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$VER/g" -e "s/@SHA256_AARCH64_APPLE_DARWIN@/$arm/g" -e "s/@SHA256_X86_64_UNKNOWN_LINUX_GNU@/$lin/g" \
            packaging/homebrew/rootmark.rb.in >tap/Formula/rootmark.rb
          ! grep -q '@[A-Z0-9_]*@' tap/Formula/rootmark.rb
          cat tap/Formula/rootmark.rb
      - name: pull request to the tap (HOMEBREW_TAP_TOKEN: the tap repository only)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "secret HOMEBREW_TAP_TOKEN is not set" >&2; exit 1; }
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" tapdir
          cd tapdir
          git checkout -q -b "formula/rootmark-$VER"
          mkdir -p Formula && cp ../tap/Formula/rootmark.rb Formula/rootmark.rb
          git add Formula/rootmark.rb
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "rootmark $VER"
          git push -q origin "formula/rootmark-$VER"
          gh pr create -R "$TAP" --base main --head "formula/rootmark-$VER" --title "rootmark $VER" \
            --body "Formula for RootMark $VER, from the SHA256SUMS of https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG (run $GITHUB_RUN_ID)."
