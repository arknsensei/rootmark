# The mdk release binaries (K-E1.1; GOAL P1-E.1 E1-5; docs/RELEASE.md R4,
# R13). Started by a human only (workflow_dispatch): it builds, checks and
# keeps artefacts, and publishes, tags and releases nothing (the v0.1.0 tag
# and the GitHub release are human steps, docs/RELEASE.md).
#
# One release target: aarch64-apple-darwin (required: its job must pass).
# x86_64-unknown-linux-gnu and x86_64-pc-windows-msvc are CI information
# (continue-on-error): built, checked and kept when they can be, recorded as
# skipped when not; never a release criterion. Intel macOS is not a
# target. Each job runs `mdk --version`, `--spec-version` and `mdk
# conformance` (Levels 1–3 on the embedded fixtures; 34/34) through
# scripts/release_target.sh — the same record as scripts/release.sh writes
# locally — and the last job assembles dist/release.json from every record.
name: release
on:
  workflow_dispatch:

jobs:
  binary:
    name: mdk ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, archive: tar.gz, required: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, archive: tar.gz, required: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip, required: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: models/minilm-l6-v2
          key: models-${{ hashFiles('models/MANIFEST.json') }}
      - name: embedder model (pinned, checked)
        run: bash scripts/fetch_model.sh
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p mdkernel-server --bin mdk
      - name: check (version, spec version, mdk conformance 34/34)
        env:
          MDK_MODELS: ${{ github.workspace }}/models
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          bin=target/${{ matrix.target }}/release/mdk
          [ -f "$bin" ] || bin="$bin.exe"
          bash scripts/release_target.sh check ${{ matrix.target }} ${{ matrix.required }} dist/bin/${{ matrix.target }}.json "$bin"
          jq -e .ok dist/bin/${{ matrix.target }}.json
      - name: package
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          d="mdk-$ver-${{ matrix.target }}"
          mkdir -p "$d/models"
          cp target/${{ matrix.target }}/release/mdk* "$d/" 2>/dev/null || true
          rm -f "$d"/*.d "$d"/*.pdb
          cp LICENSE README.md "$d/"; cp models/MANIFEST.json scripts/fetch_model.sh "$d/models/"
          if [ "${{ matrix.archive }}" = zip ]; then 7z a "$d.zip" "$d" >/dev/null; else tar -czf "$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdk-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            mdk-*-${{ matrix.target }}.*
            dist/bin/${{ matrix.target }}.json

  record:
    name: dist/release.json
    needs: binary
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: assemble (a target without a record is recorded as skipped)
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          for t in aarch64-apple-darwin:true x86_64-unknown-linux-gnu:false x86_64-pc-windows-msvc:false; do
            target="${t%%:*}"; req="${t#*:}"
            # the record sits under dist/bin/ in the artefact, or at its root
            # when the job stopped before packaging (upload-artifact keeps
            # paths relative to the files' common ancestor)
            rec="$(find "artefacts/mdk-$target" -name "$target.json" -type f -print -quit 2>/dev/null || true)"
            if [ -n "$rec" ]; then cp "$rec" "dist/bin/$target.json"
            else bash scripts/release_target.sh skipped "$target" "$req" "dist/bin/$target.json" "no record: the job failed before its check or did not run"; fi
          done
          dirty=false
          bash scripts/release_target.sh assemble dist "$GITHUB_SHA" "$dirty"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-json
          path: dist/release.json
