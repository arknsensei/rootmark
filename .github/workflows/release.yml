# The rootmark release binaries (K-E1.1; GOAL P1-E.1 E1-5; docs/RELEASE.md R4,
# R13). Started by a human only (workflow_dispatch): it builds, checks and
# keeps artefacts, and publishes, tags and releases nothing (the v0.1.0 tag
# and the GitHub release are human steps, docs/RELEASE.md).
#
# One release target: aarch64-apple-darwin (required: its job must pass).
# x86_64-unknown-linux-gnu and x86_64-pc-windows-msvc are CI information
# (continue-on-error): built, checked and kept when they can be, recorded as
# skipped when not; never a release criterion. Intel macOS is not a
# target. Each job runs `rootmark --version`, `--spec-version` and `rootmark
# conformance` (Levels 1–3 on the embedded fixtures; 39/39 since spec 2.0.2)
# through scripts/release_target.sh — the same record as scripts/release.sh
# writes locally — and the last job assembles dist/release.json from every
# record.
# P2-A/A3 (GOAL P2-A 3): each job then installs its own archive with the
# installer (packaging/install.sh; Windows packaging/install.ps1) from a
# local SHA256SUMS, model files included, and runs the installed binary's
# `--version` and `rootmark conformance` (record `dist/bin/<target>.install.json`);
# the last job writes SHA256SUMS over every archive, attests their build
# provenance (actions/attest-build-provenance; `gh attestation verify
# <archive> -R arknsensei/rootmark`) and keeps archives, SHA256SUMS and the
# installers as the `release-files` artefact. Nothing is signed (Apple
# notarization, Windows Authenticode: human steps, docs/RELEASE.md).
name: release
on:
  workflow_dispatch:

jobs:
  binary:
    name: rootmark ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, archive: tar.gz, required: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, archive: tar.gz, required: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip, required: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v6.1.0
        with:
          path: models/minilm-l6-v2
          key: models-${{ hashFiles('models/MANIFEST.json') }}
      - name: embedder model (pinned, checked)
        run: bash scripts/fetch_model.sh
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p rootmark-server --bin rootmark
      - name: check (version, spec version, rootmark conformance 34/34)
        env:
          ROOTMARK_MODELS: ${{ github.workspace }}/models
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          bin=target/${{ matrix.target }}/release/rootmark
          [ -f "$bin" ] || bin="$bin.exe"
          bash scripts/release_target.sh check ${{ matrix.target }} ${{ matrix.required }} dist/bin/${{ matrix.target }}.json "$bin"
          jq -e .ok dist/bin/${{ matrix.target }}.json
      - name: package
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          d="rootmark-$ver-${{ matrix.target }}"
          mkdir -p "$d/models"
          cp target/${{ matrix.target }}/release/rootmark* "$d/" 2>/dev/null || true
          rm -f "$d"/*.d "$d"/*.pdb
          cp LICENSE README.md "$d/"; cp models/MANIFEST.json scripts/fetch_model.sh "$d/models/"
          if [ "${{ matrix.archive }}" = zip ]; then 7z a "$d.zip" "$d" >/dev/null; else tar -czf "$d.tar.gz" "$d"; fi
      - name: install from the archive (installer, SHA256SUMS, model) and check the installed binary
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          a="$(ls rootmark-*-${{ matrix.target }}.tar.gz)"
          mkdir -p inst-src && cp "$a" inst-src/
          (cd inst-src && { sha256sum "$a" 2>/dev/null || shasum -a 256 "$a"; } >SHA256SUMS)
          bash packaging/install.sh --from inst-src --prefix "$RUNNER_TEMP/rm"
          export ROOTMARK_MODELS="$RUNNER_TEMP/rm/share/rootmark/models"
          bin="$RUNNER_TEMP/rm/bin/rootmark"
          "$bin" --version
          "$bin" conformance >conf.json || { cat conf.json; exit 1; }
          jq -n --arg t "${{ matrix.target }}" --arg v "$("$bin" --version)" --slurpfile c conf.json \
            '{target: $t, installer: "packaging/install.sh", version: $v, conformance: {level: $c[0].level_claimed, passed: $c[0].passed, total: $c[0].total}, ok: ($c[0].passed == $c[0].total)}' \
            >dist/bin/${{ matrix.target }}.install.json
          cat dist/bin/${{ matrix.target }}.install.json
          jq -e .ok dist/bin/${{ matrix.target }}.install.json
      - name: install from the archive (install.ps1, SHA256SUMS, model) and check the installed binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $a = (Get-ChildItem rootmark-*-${{ matrix.target }}.zip | Select-Object -First 1).Name
          New-Item -ItemType Directory -Force inst-src | Out-Null
          Copy-Item $a inst-src/
          "$((Get-FileHash -Algorithm SHA256 $a).Hash.ToLower())  $a" | Set-Content -Encoding ascii inst-src/SHA256SUMS
          ./packaging/install.ps1 -From inst-src -Prefix "$env:RUNNER_TEMP\rm"
          $env:ROOTMARK_MODELS = "$env:RUNNER_TEMP\rm\models"
          $bin = "$env:RUNNER_TEMP\rm\rootmark.exe"
          $v = (& $bin --version).Trim()
          & $bin conformance | Set-Content -Encoding utf8 conf.json
          if ($LASTEXITCODE -ne 0) { Get-Content conf.json; exit 1 }
          $c = Get-Content conf.json -Raw | ConvertFrom-Json
          $rec = [ordered]@{ target = "${{ matrix.target }}"; installer = "packaging/install.ps1"; version = $v; conformance = [ordered]@{ level = $c.level_claimed; passed = $c.passed; total = $c.total }; ok = ($c.passed -eq $c.total) }
          $rec | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 dist/bin/${{ matrix.target }}.install.json
          Get-Content dist/bin/${{ matrix.target }}.install.json
          if (-not $rec.ok) { exit 1 }
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: rootmark-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            rootmark-*-${{ matrix.target }}.*
            dist/bin/${{ matrix.target }}.json
            dist/bin/${{ matrix.target }}.install.json

  record:
    name: dist/release.json, SHA256SUMS, provenance
    needs: binary
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write      # actions/attest-build-provenance (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artefacts
      - name: assemble (a target without a record is recorded as skipped)
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          for t in aarch64-apple-darwin:true x86_64-unknown-linux-gnu:false x86_64-pc-windows-msvc:false; do
            target="${t%%:*}"; req="${t#*:}"
            # the record sits under dist/bin/ in the artefact, or at its root
            # when the job stopped before packaging (upload-artifact keeps
            # paths relative to the files' common ancestor)
            rec="$(find "artefacts/rootmark-$target" -name "$target.json" -type f -print -quit 2>/dev/null || true)"
            if [ -n "$rec" ]; then cp "$rec" "dist/bin/$target.json"
            else bash scripts/release_target.sh skipped "$target" "$req" "dist/bin/$target.json" "no record: the job failed before its check or did not run"; fi
          done
          dirty=false
          bash scripts/release_target.sh assemble dist "$GITHUB_SHA" "$dirty"
      - name: SHA256SUMS over every archive
        run: |
          set -euo pipefail
          mkdir -p release
          find artefacts -type f \( -name 'rootmark-*.tar.gz' -o -name 'rootmark-*.zip' \) -exec cp {} release/ \;
          ls release | grep -q . || { echo "no archive to sum" >&2; exit 1; }
          (cd release && sha256sum rootmark-* >SHA256SUMS && cat SHA256SUMS && sha256sum -c SHA256SUMS)
          cp packaging/install.sh packaging/install.ps1 release/
          find artefacts -name '*.install.json' -exec cp {} dist/bin/ \;
      - name: build provenance of the archives (GitHub artifact attestations)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            release/rootmark-*.tar.gz
            release/rootmark-*.zip
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: release-json
          path: |
            dist/release.json
            dist/bin/*.install.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-files
          path: release/
