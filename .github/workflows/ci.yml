name: ci
on:
  push:
  pull_request:

jobs:
  deps:
    name: dependency direction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: bash scripts/check_deps.sh
      - run: bash scripts/test_check_deps.sh

  test:
    name: test + lint + conformance
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags v2-final/v3-final and prototype history are read by tests
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # embedder model (models/MANIFEST.json) and the ONNX Runtime download of `ort`
      - uses: actions/cache@v4
        with:
          path: |
            models/minilm-l6-v2
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          key: models-${{ runner.os }}-${{ hashFiles('models/MANIFEST.json', 'Cargo.lock') }}
      - run: make models
      - run: make test
      - run: make lint
      - run: make conformance
