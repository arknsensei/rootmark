# Quality gates on every pull request to main and every push to main
# (GOAL GH-0 G2; docs/DEV_PROCESS.md §3): dependency direction and age,
# then test + lint + conformance. Required for merging into main (branch
# protection, GH-0 G3): "dependency direction and age" and "test + lint +
# conformance (macos-14)" — the platform the suite was validated on and the
# release target (K-E1.1). Since P2-A (K-GH.6: `propose` refuses another
# spelling of an existing directory on every platform) the Linux job is no
# longer information: it must pass (making it a required check of the
# ruleset is a human step, docs/rounds/P2-A/progress/STOP.md).
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: dependency direction and age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # check_dep_age reads `git blame` of each declaration
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: bash scripts/check_deps.sh
      - run: bash scripts/test_check_deps.sh
      - run: bash scripts/check_dep_age.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the actions' release dates (API rate limit)

  test:
    # the check's name is the ruleset's required check and stays; GitHub
    # retires the macos-14 image on 2026-11-02 (brownouts before it), so the
    # job runs on macos-15, the same arm64 platform (P2-V.1, ASSUMPTIONS E2-1;
    # renaming the check is a ruleset change, a human step)
    name: test + lint + conformance (macos-14)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # tags v2-final/v3-final/p*-final, ROUND_START shas and prototype history are read by tests and check_frozen
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      # embedder model (models/MANIFEST.json) and the ONNX Runtime download of `ort`
      - uses: actions/cache@v6.1.0
        with:
          path: |
            models/minilm-l6-v2
            models/multilingual-minilm-l12-v2
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          key: models-${{ runner.os }}-${{ hashFiles('models/MANIFEST*.json', 'Cargo.lock') }}
      # P2-L/L2: the multilingual embedder option's tests need its model too
      - run: make models models-multilingual
      - run: make test
      - run: make lint
      - run: make conformance

  test-linux:
    name: test + lint + conformance (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # tags v2-final/v3-final/p*-final, ROUND_START shas and prototype history are read by tests and check_frozen
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      # embedder model (models/MANIFEST.json) and the ONNX Runtime download of `ort`
      - uses: actions/cache@v6.1.0
        with:
          path: |
            models/minilm-l6-v2
            models/multilingual-minilm-l12-v2
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          key: models-${{ runner.os }}-${{ hashFiles('models/MANIFEST*.json', 'Cargo.lock') }}
      # P2-L/L2: the multilingual embedder option's tests need its model too
      - run: make models models-multilingual
      - run: make test
      - run: make lint
      - run: make conformance

  # Tier 1 of the verification chain (GOAL P2-V V2, K-P2V.1; docs/DEV_PROCESS.md
  # §3): `make verify FAST=1` as it is — two clean fast chains (the active
  # block's checks, conformance, the regress against the last official RUN)
  # compared with the frozen `eval.compare_p2r fast` — on every pull request,
  # each chain on its own runner (`scripts/verify.sh chain-fast`, the
  # commit's own); the records carry no host value (`eval.portable --fast`).
  fast:
    name: fast chain ${{ matrix.side }} (tier 1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [A, B]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # the chain clones this repository (tags, ROUND_START shas, history)
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            models/minilm-l6-v2
            models/multilingual-minilm-l12-v2
            ~/.cache/ort.pyke.io
          key: models-${{ runner.os }}-${{ hashFiles('models/MANIFEST*.json', 'Cargo.lock') }}
      # crate sources only (checked against Cargo.lock's checksums); nothing
      # compiled is cached: each chain builds everything in its own clone
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-sources-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: verify.sh chain-fast
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; work="$RUNNER_TEMP/f/$SIDE"
          mkdir -p "$out"
          date -u +%s >"$out/started_epoch"
          jq -n --arg w "$work" --arg h "$HOME" --arg t "${TMPDIR:-}" --arg u "$(id -un)" --arg n "$(hostname)" \
            --arg rt "$RUNNER_TEMP" --arg ws "$GITHUB_WORKSPACE" \
            '{workdir: $w, home: $h, tmpdir: $t, user: $u, host: $n, extra: [$rt, $ws]}' >"$out/host.json"
          bash scripts/verify.sh chain-fast "$GITHUB_WORKSPACE" "$work" >"$out/result" 2>"$out/chain.log" \
            || { tail -60 "$out/chain.log"; exit 1; }
          date -u +%s >"$out/finished_epoch"
          tail -20 "$out/chain.log"
          run_dir="$(sed -n 's/^RUN_DIR=//p' "$out/result")"
          mkdir -p "$out/run"
          cp -R "$run_dir/." "$out/run/"
      - name: keep the fast chain's RUN
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tier1-${{ matrix.side }}
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/out/

  fast-compare:
    name: fast pair compare (tier 1)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: research environment
        run: cd research && uv sync --frozen --inexact
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: tier1-*
          path: ${{ runner.temp }}/in
      - name: compare_p2r fast, host values, time
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/in"; o="$RUNNER_TEMP/compare"; mkdir -p "$o"
          cd research
          uv run --frozen python -m eval.compare_p2r fast "$in/tier1-A/run" "$in/tier1-B/run" --out "$o/fast_pair_compare.json" >/dev/null
          echo "fast pair equal ($(jq -r .n_fields "$o/fast_pair_compare.json") fields)"
          for s in A B; do
            uv run --frozen python -m eval.portable "$in/tier1-$s/run" --fast --host "$in/tier1-$s/host.json" --out "$o/portable_$s.json" >/dev/null
          done
          echo "no host value in the fast records"
          t0="$(cat "$in"/tier1-*/started_epoch | sort -n | head -1)"
          jq -n --argjson s "$(( $(date -u +%s) - t0 ))" '{elapsed_s: $s, from: "the first fast chain started"}' | tee "$o/fast_pair_time.json"
      - name: keep the comparison
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tier1-compare
          if-no-files-found: warn
          path: ${{ runner.temp }}/compare/

  # P2-V.1/E2 (GOAL P2-V.1 Kapsam 3, V1-2; part of tier 1): the embedder's
  # processor independence on every pull request. The designated subset of
  # the P1-C corpus D3 (`scripts/embed_cpu.sh`: every tenth document, 102)
  # is indexed with both manifest models on three processors — x86_64 Linux,
  # aarch64 Linux, macOS arm64 (macos-15) — and the vector files, index manifests and
  # flat-mode search records (cosine scores) are compared byte for byte
  # (`research/p2v1/e2_compare.py`); one differing byte is red. The processor
  # models are recorded with the verdict.
  embed-cpu:
    name: embed cpu ${{ matrix.label }} (tier 1, E2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: x86_64-linux }
          - { os: ubuntu-24.04-arm, label: aarch64-linux }
          - { os: macos-15, label: arm64-macos }   # GOAL's macos-14 is retired (ASSUMPTIONS E2-1)
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/cache@v6.1.0
        with:
          path: |
            models/minilm-l6-v2
            models/multilingual-minilm-l12-v2
          key: embed-cpu-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('models/MANIFEST*.json') }}
      - run: make models models-multilingual
      # the workspace (the `rootmark` binary) and the binding D3's builder uses
      - run: make setup-py build
      - name: D3 (verified against research/data/MANIFEST.d3.json)
        run: make d3
      - name: embed_cpu.sh
        env:
          LABEL: ${{ matrix.label }}
        run: bash scripts/embed_cpu.sh target/release/rootmark "$RUNNER_TEMP/out/embed-cpu-$LABEL" "$LABEL"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: embed-cpu-${{ matrix.label }}
          if-no-files-found: error
          path: ${{ runner.temp }}/out/embed-cpu-${{ matrix.label }}/

  embed-cpu-compare:
    name: embed cpu compare (tier 1, E2)
    needs: embed-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: embed-cpu-*
          path: ${{ runner.temp }}/in
      - name: byte equality on three processors
        run: python3 research/p2v1/e2_compare.py "$RUNNER_TEMP/in" --out "$RUNNER_TEMP/compare/e2_compare.json"
      - name: keep the comparison
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: embed-cpu-compare
          if-no-files-found: warn
          path: ${{ runner.temp }}/compare/
