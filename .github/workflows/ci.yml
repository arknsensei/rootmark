# Quality gates on every pull request to main and every push to main
# (GOAL GH-0 G2; docs/DEV_PROCESS.md §3): dependency direction and age,
# then test + lint + conformance. Required for merging into main (branch
# protection, GH-0 G3): "dependency direction and age" and "test + lint +
# conformance (macos-14)" — the platform the suite was validated on and the
# release target (K-E1.1). Since P2-A (K-GH.6: `propose` refuses another
# spelling of an existing directory on every platform) the Linux job is no
# longer information: it must pass (making it a required check of the
# ruleset is a human step, docs/rounds/P2-A/progress/STOP.md).
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: dependency direction and age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # check_dep_age reads `git blame` of each declaration
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: bash scripts/check_deps.sh
      - run: bash scripts/test_check_deps.sh
      - run: bash scripts/check_dep_age.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the actions' release dates (API rate limit)

  test:
    name: test + lint + conformance (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # tags v2-final/v3-final/p*-final, ROUND_START shas and prototype history are read by tests and check_frozen
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      # embedder model (models/MANIFEST.json) and the ONNX Runtime download of `ort`
      - uses: actions/cache@v6.1.0
        with:
          path: |
            models/minilm-l6-v2
            models/multilingual-minilm-l12-v2
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          key: models-${{ runner.os }}-${{ hashFiles('models/MANIFEST*.json', 'Cargo.lock') }}
      # P2-L/L2: the multilingual embedder option's tests need its model too
      - run: make models models-multilingual
      - run: make test
      - run: make lint
      - run: make conformance

  test-linux:
    name: test + lint + conformance (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # tags v2-final/v3-final/p*-final, ROUND_START shas and prototype history are read by tests and check_frozen
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      # embedder model (models/MANIFEST.json) and the ONNX Runtime download of `ort`
      - uses: actions/cache@v6.1.0
        with:
          path: |
            models/minilm-l6-v2
            models/multilingual-minilm-l12-v2
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          key: models-${{ runner.os }}-${{ hashFiles('models/MANIFEST*.json', 'Cargo.lock') }}
      # P2-L/L2: the multilingual embedder option's tests need its model too
      - run: make models models-multilingual
      - run: make test
      - run: make lint
      - run: make conformance
