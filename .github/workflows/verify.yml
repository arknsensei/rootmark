# Independent reproduction (GOAL GH-0 G2; docs/DEV_PROCESS.md §3 `make
# verify`): two independent clones and chains, compared field by field and
# byte by byte (scripts/verify.sh pair). A non-zero exit is red. Weekly and
# by hand.
#
# Runs on ubuntu-latest (GH-0 ASSUMPTIONS G2-2). The chain was written on the
# release platform (macOS arm64): here the real-Obsidian e2e is recorded as
# skipped (no Obsidian binary), the Linux cross build in Docker is skipped,
# and the chain's release step packages the native Linux binary under the
# aarch64-apple-darwin label — its record is a determinism artefact, not a
# release record (release records come from release.yml). The verdict of
# this workflow is the pair comparison (exit code); the recorded criteria and
# the FAIL summary are kept as an artefact.
name: verify
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  pair:
    name: verify.sh pair
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the chain clones this repository (tags and history)
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: |
            models/minilm-l6-v2
            ~/.cache/ort.pyke.io
          key: models-${{ runner.os }}-${{ hashFiles('models/MANIFEST.json', 'Cargo.lock') }}
      # the two chains build several Rust trees each (current, p1d-final,
      # p1e-final, v3-final, generators): the runner's free disk is not
      # enough (the first dispatch stopped in chain A with `tar: Cannot
      # write: Broken pipe`, GH-0 G5)
      - name: free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - name: verify.sh pair
        env:
          ROOTMARK_RELEASE_LINUX: "0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          bash scripts/verify.sh pair "$GITHUB_WORKSPACE" "$RUNNER_TEMP/verify/A" "$RUNNER_TEMP/verify/B" 2>&1 | tee "$RUNNER_TEMP/verify/verify.log"
      - name: disk at the end
        if: always()
        run: df -h /
      - name: keep the pair record and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-pair
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/verify/verify.log
            ${{ runner.temp }}/verify/*/repo/research/reports/runs/*/pair_compare.json
            ${{ runner.temp }}/verify/*/repo/research/reports/runs/*/*_checks.json
