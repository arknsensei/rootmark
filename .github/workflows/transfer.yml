# The lab -> product transfer (D-1; docs/rounds/D-1/progress/DESIGN.md §2.1,
# reports/rounds/D-0/TRANSFER_PLAN.md §2). Started by a human only
# (workflow_dispatch) with a lab tag vX.Y.Z: the transfer tool of THAT tag
# (research/transfer/) builds the product tree twice and compares the tree
# ids, then writes one commit on the product repository's branch
# transfer/vX.Y.Z (parent: the product main; with `bootstrap`, the first
# release: a root commit, the product repository having no main yet) and
# pushes it with a deploy key (secret PRODUCT_REPO_DEPLOY_KEY: write access
# to rootmark-ai/rootmark only). It opens no pull request (a deploy key
# cannot; a human does, docs/rounds/D-1/progress/ASSUMPTIONS.md A1) and
# never pushes to main or forces a push. The commit is deterministic: author
# and committer github-actions[bot], date = the lab commit's committer date.
name: transfer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "lab tag to transfer (vX.Y.Z)"
        required: true
        type: string
      bootstrap:
        description: "first transfer: the product repository has no main yet (root commit)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: transfer
  cancel-in-progress: false

jobs:
  transfer:
    name: transfer ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
      PRODUCT: rootmark-ai/rootmark
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: the tag and the tool at the tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z: $TAG" >&2; exit 1; }
          git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null
          git worktree add --detach "$RUNNER_TEMP/lab" "$TAG"
      - name: build the product tree twice and compare
        working-directory: ${{ runner.temp }}/lab/research
        run: |
          set -euo pipefail
          python3 --version
          python3 -E -s -m transfer.cli build --ref "$TAG" --tag "$TAG" --out "$RUNNER_TEMP/A"
          python3 -E -s -m transfer.cli build --ref "$TAG" --tag "$TAG" --out "$RUNNER_TEMP/B"
          a="$(jq -r .tree "$RUNNER_TEMP/A/transfer_result.json")"; b="$(jq -r .tree "$RUNNER_TEMP/B/transfer_result.json")"
          [ "$a" = "$b" ] || { echo "two runs differ: $a $b" >&2; diff <(cd "$RUNNER_TEMP/A/tree" && find . -type f -exec sha256sum {} + | sort) <(cd "$RUNNER_TEMP/B/tree" && find . -type f -exec sha256sum {} + | sort) | head -40; exit 1; }
          echo "TREE=$a" >>"$GITHUB_ENV"
          echo "LAB_COMMIT=$(jq -r .lab_commit "$RUNNER_TEMP/A/transfer_result.json")" >>"$GITHUB_ENV"
          echo "LAB_DATE=$(jq -r .lab_commit_date "$RUNNER_TEMP/A/transfer_result.json")" >>"$GITHUB_ENV"
          { echo "### transfer $TAG"; echo; echo "tree \`$a\` (two runs equal); lab commit \`$(jq -r .lab_commit "$RUNNER_TEMP/A/transfer_result.json")\`"; echo; jq -c .counts "$RUNNER_TEMP/A/transfer_result.json"; } >>"$GITHUB_STEP_SUMMARY"
      - name: commit and push transfer/${{ inputs.tag }}
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCT_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_KEY" ] || { echo "secret PRODUCT_REPO_DEPLOY_KEY is not set (human step)" >&2; exit 1; }
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          printf '%s\n' "$DEPLOY_KEY" | ssh-add - >/dev/null
          mkdir -p ~/.ssh && ssh-keyscan -t ed25519 github.com >>~/.ssh/known_hosts 2>/dev/null
          url="git@github.com:$PRODUCT.git"
          g="git --git-dir=$RUNNER_TEMP/A/tree.git"
          main="$(git ls-remote "$url" refs/heads/main | cut -f1)"
          branch="transfer/$TAG"
          existing="$(git ls-remote "$url" "refs/heads/$branch" | cut -f1)"
          if [ -n "$main" ]; then parent=(-p "$main"); $g fetch -q "$url" main
          elif [ "$BOOTSTRAP" = true ]; then parent=()
          else echo "the product repository has no main: run with bootstrap (first transfer only)" >&2; exit 1; fi
          if [ -n "$main" ] && [ "$BOOTSTRAP" = true ]; then echo "bootstrap requested but the product main exists" >&2; exit 1; fi
          msg="$(printf 'rootmark %s\n\nLab-Commit: %s\nLab-Tag: %s\nTransfer-Tree: %s\n' "${TAG#v}" "$LAB_COMMIT" "$TAG" "$TREE")"
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="$LAB_DATE" GIT_COMMITTER_DATE="$LAB_DATE"
          c="$(printf '%s\n' "$msg" | $g commit-tree "$TREE" "${parent[@]}")"
          [ "$($g rev-parse "$c^{tree}")" = "$TREE" ] || { echo "commit tree differs" >&2; exit 1; }
          if [ -n "$existing" ]; then
            [ "$existing" = "$c" ] || { echo "$branch exists at $existing, not $c (no force push)" >&2; exit 1; }
            echo "$branch already at $c"
          else
            $g push "$url" "$c:refs/heads/$branch"
          fi
          { echo; echo "product commit \`$c\` on \`$branch\` (parent: ${main:-none, root commit})"; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: transfer-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/A/transfer_result.json
            ${{ runner.temp }}/A/tree/TRANSFER.json
