# P2-V.1/E0 (TASKS E0; K-P2V1.1): one-off feasibility measurement. The same
# fixed corpus (`research/data/d_notes/notes`, in git) is embedded on runners
# with different processors, with the ONNX Runtime embedder of
# `index/src/embed.rs` (the product today) and with the fixed-order forward
# pass of `index/src/detbert.rs` (candidate (r)); raw binary32 vectors, the
# processor model and timings are kept as artifacts and compared offline
# (`research/p2v1/e0_feasibility.py` → `reports/rounds/P2-V.1/e0/`).
# Runs on pushes to the round's branch that touch this file or the tool.
name: e0-feasibility
on:
  push:
    branches: [p2-v.1/round]
    paths:
      - .github/workflows/e0-feasibility.yml
      - index/examples/e0_embed.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embed:
    name: embed ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: x86_64-a }
          - { os: ubuntu-latest, label: x86_64-b }
          - { os: ubuntu-24.04-arm, label: aarch64 }
          - { os: macos-14, label: macos-arm64 }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/cache@v6.1.0
        with:
          path: |
            models/minilm-l6-v2
            models/multilingual-minilm-l12-v2
          key: e0-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('models/MANIFEST*.json') }}
      - name: processor
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e0"; mkdir -p "$out"
          if [ "$(uname)" = Darwin ]; then
            model="$(sysctl -n machdep.cpu.brand_string)"
            flags="$(sysctl -a | grep -E '^hw.optional' | tr '\n' ' ')"
          else
            model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            flags="$(grep -m1 -E '^(flags|Features)' /proc/cpuinfo | cut -d: -f2-)"
          fi
          jq -n --arg label "${{ matrix.label }}" --arg os "${{ matrix.os }}" --arg arch "$(uname -m)" \
            --arg model "$model" --arg flags "$flags" \
            '{label: $label, runner_os: $os, arch: $arch, cpu_model: $model, cpu_flags: $flags}' | tee "$out/cpu.json"
      - run: make models models-multilingual
      - run: cargo build --release -p rootmark-index --example e0_embed
      - name: embed (both manifest models)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e0"
          ./target/release/examples/e0_embed research/data/d_notes/notes "$out/minilm-l6-v2" minilm-l6-v2
          ./target/release/examples/e0_embed research/data/d_notes/notes "$out/multilingual-minilm-l12-v2" multilingual-minilm-l12-v2
          ls -la "$out"/*
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: e0-${{ matrix.label }}
          if-no-files-found: error
          path: ${{ runner.temp }}/e0/
