# Security updates only (GOAL GH-0 G2): version updates are switched off
# (`open-pull-requests-limit: 0`) because every dependency is pinned on
# purpose (exact versions, at least 14 days old: scripts/check_dep_age.sh).
# Dependabot security updates are enabled in the repository settings (GH-0
# G3); a security fix younger than 14 days needs an entry with a decision in
# scripts/dep_age_exceptions.txt.
# GH-1 (K-GH1.1): the VS Code client is listed too (P2-B added it after
# GH-0), and each ecosystem's security updates come as one grouped pull
# request instead of one per package (`groups`, `applies-to:
# security-updates`); the 14-day rule still decides when one is merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /clients/obsidian
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /clients/vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /research
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
