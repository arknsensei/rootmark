[package]
name = "mdkernel-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "mdkcore"
path = "src/lib.rs"

[[bin]]
name = "mdk"
path = "src/bin/mdk.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8.7", features = ["pure"] }
clap = { version = "4.6.7", features = ["derive"] }
pathfinding = "4.16.0"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
tiktoken-rs = "0.12.1"
unicode-normalization = "0.1.25"

[dev-dependencies]
blake3 = { version = "1.8.7", features = ["pure"] }
regex = "1.13.1"
