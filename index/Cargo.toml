[package]
name = "rootmark-index"
version = "0.2.0"
edition = "2021"
description = "Derived indexes over rootmark-core (spec §9): tantivy lexical, exact cosine vectors, ONNX MiniLM embedder, RRF hybrid, checkpoint-scoped queries, hot tier."

[lib]
name = "rootmarkindex"
path = "src/lib.rs"

[[bin]]
name = "rootmark-index"
path = "src/bin/rootmark-index.rs"

[dependencies]
anyhow = "1.0.104"
rootmark-core = { path = "../core" }
blake3 = { version = "1.8.7", features = ["pure"] }
clap = { version = "4.6.7", features = ["derive"] }
ndarray = "=0.17.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tantivy = { version = "=0.26.2", default-features = false, features = ["mmap"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
